<script type="text/babel">
  const { useEffect } = React;

  function useScrollReveal() {
    useEffect(() => {
      const els = document.querySelectorAll(".reveal");
      if (!("IntersectionObserver" in window)) {
        els.forEach((el) => el.classList.add("is-in"));
        return;
      }
      const io = new IntersectionObserver(
        (entries) => {
          for (const e of entries) {
            if (e.isIntersecting) { e.target.classList.add("is-in"); io.unobserve(e.target); }
          }
        },
        { threshold: 0.12, rootMargin: "0px 0px -50px 0px" }
      );
      els.forEach((el) => io.observe(el));
      return () => io.disconnect();
    }, []);
  }

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "accent": "#370FDD",
    "displayFont": "Space Grotesk",
    "ambientMotion": true
  }/*EDITMODE-END*/;

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    useScrollReveal();

    useEffect(() => {
      const root = document.documentElement;
      root.style.setProperty("--ict-core-indigo", t.accent);
      root.style.setProperty("--ed-display", `"${t.displayFont}", system-ui, sans-serif`);
      root.classList.toggle("motion-off", !t.ambientMotion);
    }, [t.accent, t.displayFont, t.ambientMotion]);

    return (
      <>
        <Nav />
        <main id="main-content" tabIndex="-1">
          <Hero />
          <Challenge />
          <Approach />
          <Services />
          <Partners />
          <WhyICT />
          <SuccessStories />
          <CTABanner />
        </main>
        <Footer />
        <TweaksPanel>
          <TweakSection label="Brand" />
          <TweakColor label="Accent" value={t.accent}
            options={["#370FDD", "#0098FF", "#612DF5", "#19C6D6"]}
            onChange={(v) => setTweak("accent", v)} />
          <TweakRadio label="Headline font" value={t.displayFont}
            options={["Space Grotesk", "Inter"]}
            onChange={(v) => setTweak("displayFont", v)} />
          <TweakSection label="Motion" />
          <TweakToggle label="Ambient motion" value={t.ambientMotion}
            onChange={(v) => setTweak("ambientMotion", v)} />
        </TweaksPanel>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
