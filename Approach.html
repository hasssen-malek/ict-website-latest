<script type="text/babel">
  const { useEffect } = React;
  function useScrollReveal() {
    useEffect(() => {
      const els = document.querySelectorAll(".reveal");
      if (!("IntersectionObserver" in window)) { els.forEach((el) => el.classList.add("is-in")); return; }
      const io = new IntersectionObserver((entries) => { for (const e of entries) { if (e.isIntersecting) { e.target.classList.add("is-in"); io.unobserve(e.target); } } }, { threshold: 0.08, rootMargin: "0px 0px -40px 0px" });
      els.forEach((el) => io.observe(el));
      return () => io.disconnect();
    }, []);
  }
  function App() { useScrollReveal(); return (<><Nav /><main id="main-content" tabIndex="-1"><ApproachPage /></main><Footer /></>); }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script src="components/cookie-consent.js"></script>
