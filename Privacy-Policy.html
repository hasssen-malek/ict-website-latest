ml'>Cookie Policy</a> for details."]},{"h":"Sharing information","body":["We treat your information as confidential. We may share it only where necessary:",{"ul":["With trusted service providers who support our operations under appropriate confidentiality and data-protection terms.","With technology partners where required to deliver a service you have requested.","Where required by law, regulation, or valid legal process."]}]},{"h":"Data security","body":["As an enterprise technology company, security is central to how we operate. We apply organisational and technical controls appropriate to the sensitivity of the information we hold, including access controls, encryption where appropriate, and monitoring."]},{"h":"International transfers","body":["We are based in Qatar and primarily process information here. Where information is transferred to or accessed from another country, for example through a technology provider, we take steps to ensure it remains protected to a comparable standard."]},{"h":"Data retention","body":["We retain personal information only for as long as needed to respond to your enquiry, fulfil our obligations, and meet legal or regulatory requirements. When it is no longer needed, we securely delete or anonymise it."]},{"h":"Your rights","body":["Subject to applicable law, you may request access to the personal information we hold about you, ask us to correct or delete it, or object to certain processing. To make a request, contact us using the details below."]},{"h":"Contact information","body":["For questions about this policy, contact ICT W.L.L at <a href='mailto:info@ict.com.qa'>info@ict.com.qa</a> or by post at Lusail Boulevard, West Bay, Doha, Qatar."]}]};

<script type="text/babel">
  const { useEffect } = React;
  function useScrollReveal() {
    useEffect(() => {
      const els = document.querySelectorAll(".reveal");
      if (!("IntersectionObserver" in window)) { els.forEach((el) => el.classList.add("is-in")); return; }
      const io = new IntersectionObserver((entries) => {
        for (const e of entries) { if (e.isIntersecting) { e.target.classList.add("is-in"); io.unobserve(e.target); } }
      }, { threshold: 0.1, rootMargin: "0px 0px -40px 0px" });
      els.forEach((el) => io.observe(el));
      return () => io.disconnect();
    }, []);
  }
  function App() { useScrollReveal(); return (<><Nav /><main id="main-content" tabIndex="-1"><LegalPage data={window.LEGAL_DATA} /></main><Footer /></>); }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
